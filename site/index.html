<style>
:root{
  --bg:#bfe0ff;
  color-scheme:light;
  --ink:#2b2050;
  --muted:#4f4380;
  --pink:#ff6fbf;
  --purple:#9a63ff;
  --blue:#4fa3ff;
  --pink-soft:#ffd2ec;
  --purple-soft:#e3d4ff;
  --blue-soft:#e6f2ff;
  --deep-purple:#4a2690;
  --drop:#2b2050;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Gaegu","Comic Sans MS","Chalkboard SE","Marker Felt",cursive;font-size:1.25rem}
.page{max-width:900px;margin:0 auto;padding:clamp(16px,4vw,44px);text-align:center}

h1{display:inline-block;margin:0 0 clamp(22px,4vw,40px);padding:10px clamp(16px,3vw,30px);
  background:var(--purple);color:#fff;font-size:clamp(2rem,5.4vw,3.2rem);line-height:1.05;
  text-shadow:2px 2px 0 var(--deep-purple);border:3px solid var(--ink);
  border-radius:255px 16px 225px 16px/16px 225px 16px 255px;box-shadow:5px 6px 0 var(--drop);transform:rotate(-1deg)}

.choices{display:grid;grid-template-columns:1fr 1fr;gap:clamp(18px,4vw,40px)}
@media (max-width:560px){.choices{grid-template-columns:1fr}}
.choice{display:flex;flex-direction:column;align-items:center;gap:14px}

.world{width:100%;min-height:clamp(200px,34vw,300px);padding:18px 14px;cursor:pointer;touch-action:manipulation;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  font-family:inherit;font-weight:700;font-size:clamp(1.7rem,4.2vw,2.4rem);line-height:1.05;color:var(--ink);
  border:3px solid var(--ink);border-radius:255px 16px 225px 16px/16px 225px 16px 255px;box-shadow:5px 6px 0 var(--drop);
  transform:rotate(var(--tilt,0deg));transition:transform .15s ease,box-shadow .15s ease}
.world.george{background:var(--blue-soft);--tilt:-1.5deg}
.world.hattie{background:var(--pink-soft);--tilt:1.5deg;border-radius:16px 225px 16px 255px/255px 16px 225px 16px}
.world:hover{transform:rotate(var(--tilt)) translate(-2px,-3px);box-shadow:8px 9px 0 var(--drop)}
.world:active{transform:rotate(var(--tilt)) translate(3px,4px);box-shadow:1px 2px 0 var(--drop)}
.world:focus-visible{outline:4px dashed var(--pink);outline-offset:6px}
.world .icon{font-size:clamp(3.4rem,9vw,5rem);line-height:1}
.world .go{font-size:1.15rem;background:#fff;border:2px solid var(--ink);border-radius:20px;padding:0 14px;margin-top:4px}

.count{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:4px 18px;font-size:1.3rem;min-width:9em;
  box-shadow:3px 4px 0 var(--drop)}
.count b{font-size:1.6rem;color:var(--deep-purple)}
.count.pop b{display:inline-block;animation:pop .4s ease-out}
@keyframes pop{40%{transform:scale(1.5)}}

@media (prefers-reduced-motion:no-preference){
  .world .icon{animation:bob 4s ease-in-out infinite}
  .world.hattie .icon{animation-delay:-2s}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
}
@media (prefers-reduced-motion:reduce){
  .world,.count.pop b{transition:none;animation:none}
}
</style>
</head>
<body>
<main class="page">
  <h1>Which world do you want to join?</h1>
  <div class="choices">
    <div class="choice">
      <button class="world george" data-world="george" data-href="george.html">
        <span class="icon" aria-hidden="true">🚀</span>George's World
        <span class="go">Join!</span>
      </button>
      <div class="count" id="count-george" aria-live="polite">Counting…</div>
    </div>
    <div class="choice">
      <button class="world hattie" data-world="hattie" data-href="hattie.html">
        <span class="icon" aria-hidden="true">🌈</span>Hattie's World
        <span class="go">Join!</span>
      </button>
      <div class="count" id="count-hattie" aria-live="polite">Counting…</div>
    </div>
  </div>
</main>
<script>
(function(){
  var COUNTER = "counter.php";
  var worlds = ["george", "hattie"];
  var totals = {};

  function show(world, pop){
    var el = document.getElementById("count-" + world);
    var n = totals[world];
    if(typeof n !== "number"){ el.textContent = "Can't count right now"; return; }
    el.innerHTML = "Picked <b>" + n + "</b> " + (n === 1 ? "time" : "times");
    if(pop){ el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); }
  }

  function useTotals(data){
    worlds.forEach(function(w){
      if(data && typeof data[w] === "number") totals[w] = data[w];
    });
  }

  function load(){
    fetch(COUNTER, { cache: "no-store" })
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(useTotals)
      .catch(function(){})
      .then(function(){ worlds.forEach(function(w){ show(w); }); });
  }

  var leaving = false;
  function join(btn){
    if(leaving) return; // one count per tap, even if a finger double-taps
    leaving = true;
    var world = btn.getAttribute("data-world");
    if(typeof totals[world] === "number"){ totals[world]++; show(world, true); }
    try{
      fetch(COUNTER + "?world=" + world, { method: "POST", keepalive: true, cache: "no-store" }).catch(function(){});
    }catch(e){}
    // Wait a moment so the new number can be seen, then go to that world.
    setTimeout(function(){ location.href = btn.getAttribute("data-href"); }, 700);
  }

  document.querySelectorAll(".world").forEach(function(btn){
    btn.addEventListener("click", function(){ join(btn); });
  });
  // Coming back with the Back button can show an old copy of the page, so fetch fresh numbers.
  window.addEventListener("pageshow", function(e){ if(e.persisted){ leaving = false; load(); } });
  load();
})();
</script>
</body>
</html>
