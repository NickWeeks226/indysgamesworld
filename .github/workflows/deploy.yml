# Uploads Hattie's Worlds to the IONOS webspace whenever the site changes.
# Save this in the GitHub repo as:  .github/workflows/deploy.yml
# The site itself goes in:          site/index.html
# Needs three repository secrets:   IONOS_HOST, IONOS_USER, IONOS_PASSWORD

name: Publish Hattie's Worlds

on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch: {}

concurrency:
  group: publish-hatties-worlds
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Get the latest version of the site
        uses: actions/checkout@v6

      - name: Install the upload tool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload to IONOS
        env:
          HOST: ${{ secrets.IONOS_HOST }}
          USER: ${{ secrets.IONOS_USER }}
          PASS: ${{ secrets.IONOS_PASSWORD }}
        run: |
          lftp -u "$USER","$PASS" "sftp://$HOST" -e "
            set sftp:auto-confirm yes;
            set net:max-retries 2;
            set net:timeout 30;
            mkdir -p -f /hattiesworlds;
            mirror --reverse --verbose --only-newer site /hattiesworlds;
            bye"
